<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白色相簿 · 纯白的每日记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='none' stroke='%235E8FB3' stroke-width='1.6' stroke-linecap='round'%3E%3Cpath d='M16 3v26M5 9.5l22 13M27 9.5L5 22.5'/%3E%3Cpath d='M16 3l-3 3.5M16 3l3 3.5M16 29l-3-3.5M16 29l3-3.5M5 9.5l4.2.4M5 9.5l1 4M27 9.5l-4.2.4M27 9.5l-1 4M5 22.5l1-4M5 22.5l4.2-.4M27 22.5l-1-4M27 22.5l-4.2-.4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@2.4.3/dist/html2canvas-pro.min.js"></script>
<style>
/* ============ 基础令牌 ============ */
:root{
  --snow:#eef5fa;
  --snow-deep:#e3eef6;
  --paper:#ffffff;
  --paper-veil:rgba(255,255,255,.90);
  --ink:#33475b;
  --ink-soft:#6f879b;
  --ink-faint:#9db2c2;
  --ice:#8fb4d1;
  --ice-deep:#5e8fb3;
  --ice-night:#44709a;
  --line:#d9e7f1;
  --line-soft:#e7f0f7;
  --lock:#a9bccb;
  --blush:#9fc0d6;
  --shadow:0 10px 34px rgba(70,110,145,.10);
  --shadow-soft:0 4px 16px rgba(70,110,145,.07);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  /* 动效令牌：统一节奏，全部只动 transform / opacity 这类合成属性 */
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.16,.64,1);
  --dur-fast:.18s;
  --dur:.26s;
  --dur-slow:.5s;
  --wallpaper-opacity:.46;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:linear-gradient(168deg,#f6fafd 0%,var(--snow) 42%,var(--snow-deep) 100%);
  font-weight:300;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* 仅在切换主题的瞬间开启颜色过渡，平时不挂常驻过渡，避免拖慢渲染 */
body.theming,
body.theming .sidebar,
body.theming .panel,
body.theming .diary-card,
body.theming .reader,
body.theming .stat-card,
body.theming .chart-panel,
body.theming .heat-panel,
body.theming .nav-item,
body.theming .tool-btn,
body.theming .tag,
body.theming .entry-item,
body.theming .cal-cell,
body.theming .cal-nav button,
body.theming .search-box input,
body.theming .tag-input,
body.theming .btn-ghost,
body.theming .noise-btn,
body.theming .diary-bar{
  transition:background-color .55s var(--ease-soft),color .55s var(--ease-soft),
             border-color .55s var(--ease-soft),box-shadow .55s var(--ease-soft);
}
#snowfield{position:fixed;inset:0;pointer-events:none;z-index:0}

/* ============ 壁纸层 ============ */
.wallpaper{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#e9f1f8}
.wallpaper .wp{
  position:absolute;inset:0;
  background-repeat:no-repeat;background-position:center center;background-size:cover;
  opacity:0;transform:scale(1.06);
  transition:opacity 1.5s var(--ease-soft),transform 2.6s var(--ease-soft);
  will-change:opacity,transform;
}
.wallpaper .wp.on{opacity:var(--wallpaper-opacity);transform:scale(1)}
/* 阅读安全层：把文字所在的中央区域柔和提亮，壁纸只在四周透出来，绝不压到字上 */
.wallpaper .scrim{
  position:absolute;inset:0;
  background:
    radial-gradient(118% 80% at 32% 26%,
      rgba(255,255,255,.94) 0%,
      rgba(255,255,255,.86) 32%,
      rgba(255,255,255,.58) 60%,
      rgba(255,255,255,.22) 100%),
    linear-gradient(180deg,rgba(247,251,254,.46),rgba(238,245,250,.26));
}
body[data-theme="dark"] .wallpaper{background:#0a1622}
body[data-theme="dark"] .wallpaper .wp{filter:brightness(.6) saturate(.85)}
body[data-theme="dark"] .wallpaper .scrim{
  background:
    radial-gradient(118% 80% at 32% 26%,
      rgba(10,22,34,.95) 0%,
      rgba(10,22,34,.88) 34%,
      rgba(10,22,34,.66) 62%,
      rgba(10,22,34,.38) 100%),
    linear-gradient(180deg,rgba(9,20,32,.52),rgba(9,20,32,.34));
}
::selection{
  background-color:#cfe4f2;
  background-image:linear-gradient(135deg,#d9ebf7,#bfd9ee);
  color:#2e5577;
  text-shadow:0 0 5px rgba(255,255,255,.5);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px;border-radius:2px}

/* ============ 布局骨架 ============ */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{
  width:268px;flex-shrink:0;
  padding:52px 30px 34px;
  display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:var(--paper-veil);
  -webkit-backdrop-filter:blur(14px) saturate(1.05);
  backdrop-filter:blur(14px) saturate(1.05);
  position:sticky;top:0;height:100vh;
  font-weight:400;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand svg{flex-shrink:0}
.brand h1{font-family:var(--serif);font-size:25px;font-weight:600;letter-spacing:4px;color:var(--ice-night)}
.brand small{display:block;font-family:var(--serif);font-size:10px;letter-spacing:2.5px;color:var(--ink-faint);font-weight:400;margin-top:2px}
.side-date{margin:22px 0 30px;padding-left:2px}
.side-date .wd{font-family:var(--serif);font-size:15px;font-weight:500;color:var(--ink-soft);letter-spacing:1px}
.side-date .wm{font-size:11px;font-weight:400;color:var(--ink-faint);margin-top:3px;letter-spacing:1px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 14px;border-radius:8px;
  font-size:14px;font-weight:500;letter-spacing:2px;color:var(--ink-soft);
  text-align:left;border:1px solid transparent;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),box-shadow var(--dur) var(--ease-soft),
             transform var(--dur) var(--ease-out);
}
.nav-item svg{flex-shrink:0;opacity:.75}
.nav-item:hover{background:#f1f7fc;color:var(--ice-night);transform:translateX(2px)}
.nav-item.active{
  background:linear-gradient(90deg,#eaf3fa,#f7fbfd);
  color:var(--ice-night);border-color:var(--line);
  box-shadow:var(--shadow-soft);
}
.nav-item.active svg{opacity:1}
.side-foot{margin-top:auto;padding-top:20px}
.side-foot button{
  display:flex;align-items:center;gap:9px;width:100%;
  font-size:12px;font-weight:500;color:var(--ink-faint);letter-spacing:1px;
  padding:8px 12px;border-radius:7px;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.side-foot button:hover{color:var(--ice-night);background:#f1f7fc;transform:translateX(2px)}
.side-foot button.on{color:var(--ice-night);background:#e8f2f9;border:1px solid var(--ice)}
.side-foot button.on svg{animation:pulseIce 2.2s ease-in-out infinite}
@keyframes pulseIce{0%,100%{opacity:.55}50%{opacity:1}}
.side-note{font-size:10.5px;font-weight:400;color:#a8bccb;line-height:1.7;margin-top:14px;padding:0 12px;letter-spacing:.5px}

main{flex:1;min-width:0;padding:48px clamp(34px,4.6vw,96px) 72px}
.view{display:none;max-width:1680px;margin:0 auto}
.view.active{display:block;animation:veil .6s var(--ease-out) both}
/* 视图内的区块依次浮现，比整块闪现更连贯 */
.view.active>*{animation:riseIn .66s var(--ease-out) both}
.view.active>*:nth-child(2){animation-delay:.06s}
.view.active>*:nth-child(3){animation-delay:.12s}
.view.active>*:nth-child(4){animation-delay:.18s}
.view.active>*:nth-child(n+5){animation-delay:.22s}
@keyframes veil{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes riseIn{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:translate3d(0,0,0)}}

/* ============ 通用标题 ============ */
.view-head{position:relative;isolation:isolate;margin-bottom:32px}
/* 标题下面垫一层柔光，背景纹理永远不会压到字上 */
.view-head::before{
  content:"";position:absolute;left:-34px;right:-34px;top:-26px;bottom:-20px;z-index:-1;border-radius:26px;pointer-events:none;
  background:radial-gradient(72% 122% at 20% 46%,rgba(255,255,255,.92) 0%,rgba(255,255,255,.6) 48%,rgba(255,255,255,0) 80%);
}
body[data-theme="dark"] .view-head::before{
  background:radial-gradient(72% 122% at 20% 46%,rgba(10,22,34,.92) 0%,rgba(10,22,34,.62) 48%,rgba(10,22,34,0) 80%);
}
.view-head .kicker{font-family:var(--serif);font-size:12px;letter-spacing:5px;color:var(--ice);margin-bottom:10px}
.view-head h2{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:5px;color:var(--ink)}
.view-head .line{width:52px;height:1px;background:var(--ice);margin-top:18px;opacity:.42}

/* ============ 今日执笔：两栏布局 ============ */
.today-layout{
  display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:24px 30px;align-items:start;
}
.diary-card{grid-column:1;grid-row:1 / span 3}
.side-time{grid-column:2;grid-row:1}
.side-tags{grid-column:2;grid-row:2}
.side-words{grid-column:2;grid-row:3}
.side-lab{font-size:11px;letter-spacing:4px;color:var(--ink-faint);margin:18px 0 10px}
.side-lab:first-child{margin-top:0}
.side-tagline{display:flex;flex-wrap:wrap;gap:9px}

.side-time .st-ymd{font-family:var(--serif);font-size:27px;font-weight:500;letter-spacing:2px;color:var(--ice-night);line-height:1.35}
.side-time .st-week{font-size:13px;color:var(--ink-soft);letter-spacing:3px;margin-top:6px}
.side-time .st-clock{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-soft)}
.side-time .st-clock span{font-family:var(--serif);font-size:40px;font-weight:400;color:var(--ice-deep);letter-spacing:3px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.side-time .st-clock small{font-size:11px;color:var(--ink-faint);letter-spacing:3px}

.side-words .sw-num{display:flex;align-items:baseline;gap:7px}
.side-words .sw-num b{font-family:var(--serif);font-size:46px;font-weight:500;color:var(--ice-night);line-height:1;font-variant-numeric:tabular-nums}
.side-words .sw-num span{font-size:14px;color:var(--ink-faint);letter-spacing:2px}
.side-words .sw-lab{font-size:12px;color:var(--ink-soft);letter-spacing:4px;margin-top:10px}
.side-words .sw-meta{font-size:11.5px;color:var(--ink-faint);margin-top:14px;line-height:1.7;min-height:20px}
.side-words .sw-rule{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
  font-family:var(--serif);font-size:12.5px;color:var(--lock);letter-spacing:2px;line-height:1.9;
}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:20px;font-size:12.5px;letter-spacing:1px;
  border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink-soft);
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),box-shadow var(--dur) var(--ease-soft),
             transform var(--dur) var(--ease-out);
}
.tag:hover{border-color:var(--ice);color:var(--ice-night);transform:translateY(-1px)}
.tag.sel{background:#e8f2f9;border-color:var(--ice);color:var(--ice-night);box-shadow:0 2px 8px rgba(94,143,179,.18)}
.tag svg{width:14px;height:14px}

.diary-card{
  background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;min-height:calc(100vh - 210px);
}
.diary-title{
  display:block;width:100%;max-width:900px;margin:0 auto;border:none;border-bottom:1px solid var(--line-soft);
  padding:26px 36px 18px;font-family:var(--serif);font-size:20px;letter-spacing:2px;
  background:transparent;font-weight:500;
}
.diary-title::placeholder{color:#b7c9d6;font-weight:300}
.diary-body{
  display:block;width:100%;max-width:900px;margin:0 auto;flex:1;border:none;resize:none;min-height:380px;
  padding:28px 36px 30px;font-family:var(--serif);font-size:16px;line-height:2.1;
  letter-spacing:.6px;background:transparent;
}
.diary-body::placeholder{color:#b7c9d6}
/* ===== 写作工具栏 ===== */
.toolbar{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  max-width:900px;margin:0 auto;width:100%;
  padding:0 36px 6px;
}
.tool-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--ink-soft);font-size:12.5px;letter-spacing:1px;
  cursor:pointer;font-family:var(--sans);
  transition:background-color var(--dur-fast) var(--ease-soft),color var(--dur-fast) var(--ease-soft),
             border-color var(--dur-fast) var(--ease-soft),transform var(--dur-fast) var(--ease-out);
}
.tool-btn:hover{background:#eef5fb;color:var(--ice-night);border-color:var(--line)}
.tool-btn.on{background:#e8f2f9;border-color:var(--ice);color:var(--ice-night)}
.tool-btn:active{transform:scale(.96)}
.tool-btn svg{flex-shrink:0}
.tool-sep{width:1px;height:18px;background:var(--line-soft);margin:0 4px}
.font-label{font-size:11px;color:var(--ink-faint);letter-spacing:1px;margin-right:2px}
/* 图片附件区 */
.img-attachments{
  display:flex;flex-wrap:wrap;gap:10px;
  max-width:900px;margin:0 auto;width:100%;
  padding:0 36px 14px;
}
.img-thumb{
  position:relative;width:110px;height:82px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);background:#f0f5fa;cursor:zoom-in;
  box-shadow:0 2px 8px rgba(94,143,179,.12);
  transition:box-shadow var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.img-thumb:hover{box-shadow:0 4px 14px rgba(94,143,179,.22);transform:translateY(-1px)}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb .img-del{
  position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
  background:rgba(40,60,80,.7);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;transition:opacity var(--dur-fast) var(--ease-soft),background-color var(--dur-fast) var(--ease-soft);
  font-size:13px;line-height:1;
}
.img-thumb:hover .img-del{opacity:1}
.img-thumb .img-del:hover{background:rgba(180,60,60,.85)}
/* 弹窗（链接插入） */
.modal-mask{
  position:fixed;inset:0;background:rgba(30,50,70,.45);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;
  animation:fadeIn .2s ease;
}
.modal-box{
  background:var(--paper);border-radius:16px;padding:28px 30px;width:380px;max-width:90vw;
  box-shadow:0 20px 60px rgba(30,50,70,.3);border:1px solid var(--line);
  animation:popIn .34s var(--ease-spring) both;
}
.modal-box h4{font-family:var(--serif);font-size:17px;letter-spacing:2px;color:var(--ice-night);margin-bottom:18px}
.modal-box label{display:block;font-size:12px;color:var(--ink-faint);letter-spacing:1px;margin-bottom:5px}
.modal-box input{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;margin-bottom:14px;background:#fbfdff;font-family:var(--sans);
  box-sizing:border-box;
}
.modal-box input:focus{outline:none;border-color:var(--ice-deep);box-shadow:0 0 0 3px rgba(94,143,179,.15)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.modal-actions button{padding:8px 20px;border-radius:20px;font-size:13px;letter-spacing:2px;cursor:pointer;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-soft)}
.modal-cancel{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.modal-cancel:hover{background:#eef5fb}
.modal-ok{background:linear-gradient(120deg,var(--ice-deep),var(--ice-night));color:#fff;border:none;box-shadow:0 4px 12px rgba(78,122,160,.3)}
.modal-ok:hover{transform:translateY(-1px)}
/* lightbox 图片放大 */
.lightbox{
  position:fixed;inset:0;background:rgba(20,35,50,.88);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:300;cursor:zoom-out;
  animation:fadeIn .2s ease;
}
.lightbox img{max-width:90vw;max-height:88vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:zoomIn .34s var(--ease-out) both}
.lightbox-close{
  position:absolute;top:24px;right:30px;color:#fff;font-size:28px;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:rgba(255,255,255,.12);
  transition:background-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.lightbox-close:hover{background:rgba(255,255,255,.25);transform:rotate(90deg)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translate3d(0,10px,0) scale(.97)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
/* 阅读态链接 */
.reader-body a{color:var(--ice-deep);text-decoration:none;border-bottom:1px solid rgba(94,143,179,.4);
  transition:color var(--dur) var(--ease-soft),border-color var(--dur) var(--ease-soft)}
.reader-body a:hover{color:var(--ice-night);border-bottom-color:var(--ice-night)}
/* 阅读态图片 */
.reader-images{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 6px}
.reader-images img{max-width:280px;max-height:200px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;box-shadow:0 2px 10px rgba(94,143,179,.12);
  transition:box-shadow var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out)}
.reader-images img:hover{box-shadow:0 4px 18px rgba(94,143,179,.25);transform:translateY(-1px)}
.diary-bar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:15px max(28px,calc((100% - 900px)/2)) 17px;
  border-top:1px solid var(--line-soft);background:#fbfdff;
}
.word-count{font-size:12px;color:var(--ink-faint);letter-spacing:1px}
.word-count b{color:var(--ice-deep);font-weight:500}
.save-meta{font-size:11.5px;color:var(--ink-faint);letter-spacing:.5px}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 30px;border-radius:24px;font-size:14px;letter-spacing:3px;
  background:linear-gradient(120deg,var(--ice-deep),var(--ice-night));
  color:#fff;box-shadow:0 6px 16px rgba(78,122,160,.28);
  transition:transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-soft),filter var(--dur) var(--ease-soft);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(78,122,160,.36);filter:brightness(1.04)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:22px;
  font-size:13px;letter-spacing:2px;border:1px solid var(--line);color:var(--ink-soft);
  background:rgba(255,255,255,.7);
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.btn-ghost:hover{border-color:var(--ice);color:var(--ice-night);transform:translateY(-1px)}

/* 打字时的冰晶反馈（克制版） */
.diary-card{position:relative;transition:box-shadow .4s var(--ease-soft),transform .4s var(--ease-out)}
.diary-card.typing{
  box-shadow:0 12px 34px rgba(94,143,179,.16),0 0 0 1px rgba(104,158,206,.28);
}
.type-mirror{
  position:absolute;left:0;top:0;z-index:-1;visibility:hidden;pointer-events:none;
  white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;
}
.ice-flake{
  position:absolute;pointer-events:none;z-index:5;opacity:0;
  animation:floatUp 1.1s cubic-bezier(.22,.7,.35,1) forwards;
}
.ice-flake svg{display:block}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,-25%) scale(.35) rotate(0deg)}
  18%{opacity:.55}
  70%{opacity:.4}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-64px) scale(.95) rotate(150deg)}
}
.ice-ripple{
  position:absolute;z-index:5;pointer-events:none;width:10px;height:10px;border-radius:50%;
  border:1.2px solid rgba(94,143,179,.5);transform:translate(-50%,-50%) scale(.3);
  animation:ripple .5s cubic-bezier(.22,.7,.35,1) forwards;
}
@keyframes ripple{
  0%{opacity:.7;transform:translate(-50%,-50%) scale(.3)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}
}

/* 封存（只读）状态 */
.locked .diary-title,.locked .diary-body{color:var(--ink)}
.seal-banner{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:14px 36px;background:linear-gradient(90deg,#f2f7fb,#f8fbfd);
  border-bottom:1px solid var(--line-soft);
  font-size:12.5px;color:var(--lock);letter-spacing:2px;
}
.seal-banner svg{flex-shrink:0}
.reader>.seal-banner{max-width:none;margin:0}

/* ============ 翻阅视图 ============ */
.browse-grid{display:grid;grid-template-columns:420px minmax(0,1fr);gap:32px;align-items:start}
.panel{
  background:var(--paper-veil);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-soft);padding:26px 28px;
  -webkit-backdrop-filter:blur(12px) saturate(1.05);
  backdrop-filter:blur(12px) saturate(1.05);
}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-head .ym{font-family:var(--serif);font-size:17px;letter-spacing:2px;color:var(--ice-night)}
.cal-nav{display:flex;gap:6px}
.cal-nav button{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  background:#fff;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.cal-nav button:hover{border-color:var(--ice);color:var(--ice-night);transform:translateY(-1px)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .dow{font-size:10.5px;color:var(--ink-faint);letter-spacing:1px;padding:6px 0}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;border-radius:9px;color:var(--ink-soft);position:relative;
  cursor:default;
  transition:background-color var(--dur-fast) var(--ease-soft),color var(--dur-fast) var(--ease-soft),
             transform var(--dur-fast) var(--ease-out);
}
.cal-cell.has{cursor:pointer;background:#eef6fb;color:var(--ice-night);font-weight:400}
.cal-cell.has:hover{background:#e0eef8;transform:scale(1.06)}
.cal-cell.has::after{
  content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;
  background:var(--ice-deep);
}
.cal-cell.today{border:1.5px solid var(--ice-deep)}
.cal-cell.selected{background:var(--ice-deep);color:#fff}
.cal-cell.selected::after{background:#fff}
.cal-cell.future{color:#cfdde8}
.cal-cell.empty{cursor:default}
.cal-legend{display:flex;gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-faint);letter-spacing:1px}
.cal-legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ice-deep);display:inline-block}
.dot.hollow{background:transparent;border:1.2px solid var(--ice-deep)}

.search-box{position:relative;margin-bottom:18px}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search-box input{
  width:100%;padding:10px 14px 10px 38px;border-radius:10px;
  border:1px solid var(--line);background:#fff;font-size:13px;letter-spacing:1px;
}
.search-box input::placeholder{color:#b7c9d6}
.entry-list{display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 360px);min-height:280px;overflow-y:auto;padding-right:4px}
.entry-item{
  padding:14px 16px;border-radius:10px;border:1px solid var(--line-soft);
  background:#fff;cursor:pointer;
  transition:background-color var(--dur) var(--ease-soft),border-color var(--dur) var(--ease-soft),
             box-shadow var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.entry-item:hover{border-color:var(--ice);box-shadow:var(--shadow-soft);transform:translateX(2px)}
.entry-item.active{border-color:var(--ice);background:#f2f8fc}
.entry-item .ei-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.entry-item .ei-date{font-family:var(--serif);font-size:14.5px;color:var(--ice-night);letter-spacing:1px}
.entry-item .ei-words{font-size:11px;color:var(--ink-faint);flex-shrink:0}
.entry-item .ei-title{font-family:var(--serif);font-size:13px;color:var(--ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-item .ei-prev{font-size:11.5px;color:var(--ink-faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 阅读面板 */
.reader{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:42px 48px;min-height:calc(100vh - 210px);position:relative}
.reader>*{max-width:840px;margin-left:auto;margin-right:auto}
.reader-empty{text-align:center;padding:110px 20px;color:var(--ink-faint)}
.reader-empty svg{opacity:.45;margin-bottom:18px}
.reader-empty p{font-family:var(--serif);font-size:15px;letter-spacing:2px}
.reader-empty small{display:block;margin-top:10px;font-size:12px;letter-spacing:1px}
.reader-head{border-bottom:1px solid var(--line-soft);padding-bottom:20px;margin-bottom:24px}
.reader-head .r-date{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:3px;color:var(--ice-night)}
.reader-head .r-week{font-size:12.5px;color:var(--ink-faint);letter-spacing:3px;margin-top:5px}
.reader-head .r-tags{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.r-tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:14px;padding:4px 11px;background:#fbfdff}
.reader-title{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:2px;margin-bottom:18px;color:var(--ink)}
.reader-body{font-family:var(--serif);font-size:15.5px;line-height:2.1;letter-spacing:.6px;white-space:pre-wrap;word-break:break-word;color:#3d5164}
.reader-meta{
  margin-top:34px;padding-top:16px;border-top:1px dashed var(--line);
  display:flex;gap:26px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-faint);letter-spacing:1px;
}
.reader-pager{display:flex;justify-content:space-between;margin-top:24px}
.reader-pager button{font-size:12.5px;color:var(--ink-soft);letter-spacing:1.5px;padding:8px 14px;border-radius:8px;border:1px solid transparent;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),border-color var(--dur) var(--ease-soft)}
.reader-pager button:hover:not(:disabled){color:var(--ice-night);border-color:var(--line);background:#f6fafd}
.reader-pager button:disabled{opacity:.3;cursor:not-allowed}

/* ============ 统计视图 ============ */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-bottom:28px}
.stat-card{
  background:var(--paper-veil);border:1px solid var(--line);border-radius:16px;
  padding:28px 30px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden;
  -webkit-backdrop-filter:blur(12px) saturate(1.05);
  backdrop-filter:blur(12px) saturate(1.05);
}
.stat-card::after{content:"";position:absolute;right:-18px;top:-18px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(143,180,209,.18),transparent 70%)}
.stat-card .num{font-family:var(--serif);font-size:44px;font-weight:500;color:var(--ice-night);letter-spacing:1px;line-height:1.1}
.stat-card .num small{font-size:15px;color:var(--ink-faint);margin-left:5px;letter-spacing:1px}
.stat-card .lab{font-size:13px;color:var(--ink-soft);letter-spacing:3px;margin-top:11px}
.stat-card .sub{font-size:11.5px;color:var(--ink-faint);margin-top:6px;letter-spacing:.5px}

.chart-row{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;margin-bottom:28px}
.chart-panel{background:var(--paper-veil);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-soft);padding:26px 30px 16px;
  -webkit-backdrop-filter:blur(12px) saturate(1.05);backdrop-filter:blur(12px) saturate(1.05)}
.chart-panel h3{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:3px;color:var(--ink);margin-bottom:4px}
.chart-panel .csub{font-size:11.5px;color:var(--ink-faint);letter-spacing:1px;margin-bottom:8px}
.chart-box{height:300px}
.heat-panel{
  background:var(--paper-veil);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-soft);padding:28px 32px;margin-bottom:28px;
  display:grid;grid-template-columns:auto minmax(260px,1fr);gap:48px;align-items:center;
  -webkit-backdrop-filter:blur(12px) saturate(1.05);backdrop-filter:blur(12px) saturate(1.05);
}
.heat-panel h3{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:3px;margin-bottom:4px}
.heat-panel .csub{font-size:11.5px;color:var(--ink-faint);letter-spacing:1px;margin-bottom:20px}
.heat-wrap{overflow-x:auto;padding-bottom:6px}
.heat-grid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;width:max-content}
.heat-cell{width:17px;height:17px;border-radius:4px;background:#edf3f8;border:1px solid #e4eef5}
.heat-side{display:flex;flex-direction:column;gap:18px;border-left:1px solid var(--line-soft);padding-left:48px;align-self:stretch;justify-content:center}
.heat-item .hv{font-family:var(--serif);font-size:30px;color:var(--ice-night);font-weight:500;line-height:1.1}
.heat-item .hv small{font-size:13px;color:var(--ink-faint);margin-left:4px}
.heat-item .hl{font-size:12px;color:var(--ink-soft);letter-spacing:3px;margin-top:5px}
.heat-cell.l1{background:#dcebf6;border-color:#d2e4f1}
.heat-cell.l2{background:#b9d6eb;border-color:#afcee5}
.heat-cell.l3{background:#8fb9d8;border-color:#84b2d3}
.heat-cell.l4{background:#5e8fb3;border-color:#5788ac}
.heat-legend{display:flex;align-items:center;gap:5px;margin-top:14px;font-size:10.5px;color:var(--ink-faint);letter-spacing:1px}
.heat-legend .cells{display:flex;gap:4px;margin-left:8px}
.month-table{width:100%;max-width:920px;border-collapse:collapse;font-size:13px}
.month-table th{font-weight:400;font-size:11.5px;color:var(--ink-faint);letter-spacing:2px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.month-table td{padding:11px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-soft)}
.month-table td.m{font-family:var(--serif);color:var(--ice-night);letter-spacing:1px}
.month-table tr:last-child td{border-bottom:none}

/* ============ 夜间模式（雪夜） ============ */
body[data-theme="dark"]{
  --snow:#0c1926;--snow-deep:#091420;
  --paper:#111f2e;--paper-veil:rgba(14,27,40,.86);
  --ink:#dce7f1;--ink-soft:#a6bacb;--ink-faint:#7b93a7;
  --ice:#7ea9c9;--ice-deep:#5f91b8;--ice-night:#a8c9e2;
  --line:#243b52;--line-soft:#1b2f43;
  --lock:#7b93a7;--blush:#7ea9c9;
  --shadow:0 10px 34px rgba(0,0,0,.38);--shadow-soft:0 4px 16px rgba(0,0,0,.3);
  background:linear-gradient(168deg,#0a1622 0%,#0c1a29 45%,#091521 100%);
}
body[data-theme="dark"] #snowfield{opacity:.5}
body[data-theme="dark"] ::selection{
  background-color:#26415c;background-image:linear-gradient(135deg,#2b4a68,#1e3550);
  color:#dcebf6;text-shadow:0 0 5px rgba(160,200,230,.35);
}
body[data-theme="dark"] .sidebar{background:rgba(10,22,34,.86)}
body[data-theme="dark"] .nav-item:hover,
body[data-theme="dark"] .side-foot button:hover{background:#14293c;color:var(--ice-night)}
body[data-theme="dark"] .tool-btn:hover{background:#142a3e;color:var(--ice-night)}
body[data-theme="dark"] .tool-btn.on{background:#1c3450;border-color:#3d76a8;color:#d9ebfa}
body[data-theme="dark"] .diary-bar{background:#0d1b29}
body[data-theme="dark"] .diary-title::placeholder,
body[data-theme="dark"] .diary-body::placeholder,
body[data-theme="dark"] .search-box input::placeholder{color:#5f7a8f}
body[data-theme="dark"] .tag{background:rgba(22,40,56,.7)}
body[data-theme="dark"] .tag.sel{background:#1c3450}
body[data-theme="dark"] .cal-nav button{background:#13212f}
body[data-theme="dark"] .cal-cell.has{background:#172d42;color:var(--ice-night)}
body[data-theme="dark"] .cal-cell.has:hover{background:#1e3a54}
body[data-theme="dark"] .cal-cell.future{color:#3c5873}
body[data-theme="dark"] .search-box input{background:#13212f}
body[data-theme="dark"] .entry-item{background:#13212f}
body[data-theme="dark"] .entry-item.active{background:#1a3046}
body[data-theme="dark"] .r-tag{background:#13212f}
body[data-theme="dark"] .reader-body{color:#c3d4e3}
body[data-theme="dark"] .reader-pager button:hover:not(:disabled){background:#142a3e}
body[data-theme="dark"] .heat-cell{background:#16293c;border-color:#1d3348}
body[data-theme="dark"] .heat-cell.l1{background:#1e3a52;border-color:#20405a}
body[data-theme="dark"] .heat-cell.l2{background:#2a5271;border-color:#2b5777}
body[data-theme="dark"] .heat-cell.l3{background:#3a6b8f;border-color:#3a6f95}
body[data-theme="dark"] .heat-cell.l4{background:#4f86ad;border-color:#4d88b0}
body[data-theme="dark"] .img-thumb{background:#13212f}
body[data-theme="dark"] .modal-box input{background:#13212f}
body[data-theme="dark"] .modal-cancel:hover{background:#142a3e}
body[data-theme="dark"] .btn-ghost:hover{background:#142a3e}
body[data-theme="dark"] .reader-tools button{color:#a6bacb}
body[data-theme="dark"] .reader-tools button:hover{background:#142a3e;color:var(--ice-night)}
body[data-theme="dark"] .tag-chip{background:#1c3450;border-color:#2b4a68}
body[data-theme="dark"] .tag-filter .tchip{background:#13212f}
body[data-theme="dark"] .tag-filter .tchip.on{background:#1c3450;border-color:var(--ice)}
body[data-theme="dark"] .tag-input{background:#13212f}
body[data-theme="dark"] .focus-exit{background:rgba(28,52,80,.85);color:#dce7f1}
body[data-theme="dark"] .noise-btn{background:#13212f;color:#a6bacb}
body[data-theme="dark"] .noise-btn.on{background:#1c3450;border-color:var(--ice);color:var(--ice-night)}
body[data-theme="dark"] .diary-card.typing{box-shadow:0 12px 34px rgba(0,0,0,.4),0 0 0 1px rgba(126,169,201,.3)}

/* ============ 自定义标签编辑器 ============ */
.tag-editor{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  max-width:900px;margin:0 auto;width:100%;padding:0 36px 12px;
}
.tag-input{
  width:150px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
  font-size:12.5px;background:#fbfdff;color:var(--ink);font-family:var(--sans);letter-spacing:1px;
}
.tag-input:focus{outline:none;border-color:var(--ice-deep);box-shadow:0 0 0 3px rgba(94,143,179,.15)}
.tag-input::placeholder{color:#b7c9d6}
.tag-chips{display:flex;flex-wrap:wrap;gap:8px}
.tag-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:14px;font-size:12px;letter-spacing:1px;
  border:1px solid var(--line);background:#eef5fb;color:var(--ice-night);
}
.tag-chip .tc-del{cursor:pointer;opacity:.55;font-size:13px;line-height:1}
.tag-chip .tc-del:hover{opacity:1;color:#b04a4a}
.tag-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tag-filter .tchip{
  padding:5px 13px;border-radius:15px;font-size:12px;letter-spacing:1px;
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.tag-filter .tchip:hover{border-color:var(--ice);color:var(--ice-night);transform:translateY(-1px)}
.tag-filter .tchip.on{background:#e8f2f9;border-color:var(--ice);color:var(--ice-night)}
.ei-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ei-tag{font-size:10.5px;color:var(--ice-night);background:#eef5fb;border:1px solid var(--line);border-radius:10px;padding:1px 8px;letter-spacing:1px}

/* ============ 专注模式 ============ */
body.focus-mode .sidebar{display:none}
body.focus-mode .view-head{display:none}
body.focus-mode .today-layout{display:block;max-width:920px;margin:0 auto}
body.focus-mode .panel{display:none}
body.focus-mode .diary-card{min-height:calc(100vh - 46px);border:none;box-shadow:none;background:transparent}
body.focus-mode main{padding:0}
.focus-exit{
  position:fixed;top:26px;right:30px;z-index:120;
  display:flex;align-items:center;gap:8px;
  padding:9px 18px;border-radius:22px;font-size:13px;letter-spacing:2px;
  background:rgba(255,255,255,.85);border:1px solid var(--line);color:var(--ink-soft);
  box-shadow:var(--shadow-soft);cursor:pointer;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.focus-exit:hover{color:var(--ice-night);border-color:var(--ice);transform:translateY(-1px)}
.noise-panel{
  position:fixed;right:30px;bottom:30px;z-index:120;
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;
  background:var(--paper-veil);border:1px solid var(--line);box-shadow:var(--shadow);
  flex-wrap:wrap;max-width:min(94vw,620px);
  -webkit-backdrop-filter:blur(12px) saturate(1.05);
  backdrop-filter:blur(12px) saturate(1.05);
}
.noise-btn{
  padding:7px 14px;border-radius:14px;font-size:12.5px;letter-spacing:2px;
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;
  transition:background-color var(--dur) var(--ease-soft),color var(--dur) var(--ease-soft),
             border-color var(--dur) var(--ease-soft),transform var(--dur) var(--ease-out);
}
.noise-btn:hover{border-color:var(--ice);color:var(--ice-night);transform:translateY(-1px)}
.noise-btn.on{background:#e8f2f9;border-color:var(--ice);color:var(--ice-night)}
/* 唱片：音乐播放时匀速旋转，暂停时停在当前角度 */
.noise-disc{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;
  background:#0d1b29 center/cover no-repeat;
  box-shadow:0 3px 12px rgba(60,100,140,.28),inset 0 0 0 1px rgba(255,255,255,.45);
}
.noise-disc img{
  width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;
  animation:discSpin 16s linear infinite;animation-play-state:paused;
  will-change:transform;user-select:none;-webkit-user-drag:none;
}
.noise-disc.spin img{animation-play-state:running}
.noise-disc::after{
  content:"";position:absolute;left:50%;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;
  border-radius:50%;background:rgba(255,255,255,.93);border:1px solid rgba(120,160,195,.45);
  box-shadow:inset 0 0 0 3px rgba(150,185,215,.3);
}
@keyframes discSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .noise-disc.spin img{animation:none}
}
.noise-vol{width:74px;accent-color:var(--ice-deep)}
.noise-panel audio{display:none}
body[data-theme="dark"] .ei-tag{background:#1c3450;border-color:#2b4a68;color:var(--ice-night)}

/* ============ 截图标注编辑器（微信式） ============ */
.shot-mask{
  position:fixed;inset:0;z-index:300;
  background:rgba(10,20,32,.78);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 24px 26px;
}
.shot-bar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;
  background:rgba(250,253,255,.96);border:1px solid var(--line);
  border-radius:14px;padding:9px 16px;box-shadow:var(--shadow);
  z-index:2;max-width:100%;
}
.shot-tools{display:flex;align-items:center;gap:4px}
.shot-tool{
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-width:34px;height:32px;padding:0 9px;border-radius:8px;
  font-size:12.5px;letter-spacing:1px;color:var(--ink-soft);
  border:1px solid transparent;cursor:pointer;transition:.15s;background:transparent;
}
.shot-tool:hover{background:#eef5fb;color:var(--ice-night)}
.shot-tool.active{background:#e8f2f9;border-color:var(--ice);color:var(--ice-night)}
.shot-sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.shot-styles{display:flex;align-items:center;gap:8px}
.color-dots{display:flex;gap:6px}
.color-dot{
  width:17px;height:17px;border-radius:50%;cursor:pointer;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(60,110,150,.35);transition:.15s;
}
.color-dot.sel{box-shadow:0 0 0 2px var(--ice-deep)}
.size-btns{display:flex;gap:3px}
.size-btn{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--line);
  background:#fff;color:var(--ink-soft);font-size:11px;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.size-btn:hover{border-color:var(--ice);color:var(--ice-night)}
.size-btn.sel{background:#e8f2f9;border-color:var(--ice);color:var(--ice-night)}
.shot-actions{display:flex;align-items:center;gap:8px}
.shot-action{
  display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;
  font-size:13px;letter-spacing:2px;color:var(--ink-soft);
  border:1px solid var(--line);background:#fff;cursor:pointer;transition:.15s;
}
.shot-action:hover{color:var(--ice-night);border-color:var(--ice)}
.shot-action.primary{background:var(--ice-deep);border-color:var(--ice-deep);color:#fff}
.shot-action.primary:hover{background:#416f95}
.shot-action:disabled{opacity:.4;cursor:default}
.shot-stage{
  position:relative;flex:1;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  margin-top:16px;overflow:hidden;border-radius:10px;
}
.shot-stage canvas{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  box-shadow:0 10px 40px rgba(0,0,0,.4);background:#fff;
}
/* 拖动平移时的抓手光标（!important 覆盖工具光标） */
.shot-stage.panning{cursor:grabbing!important}
.shot-zoom{
  min-width:58px;height:26px;padding:0 10px;border-radius:7px;
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font-size:12px;letter-spacing:.5px;cursor:pointer;transition:.15s;
  font-variant-numeric:tabular-nums;
}
.shot-zoom:hover{border-color:var(--ice);color:var(--ice-night)}
.shot-zoom.zoomed{border-color:var(--ice);background:#e8f2f9;color:var(--ice-night)}
body[data-theme="dark"] .shot-zoom{background:#15283d;border-color:#2b4a68;color:#9db8cf}
body[data-theme="dark"] .shot-zoom.zoomed{background:#1c3450;border-color:#3d76a8;color:#d9ebfa}
/* 标注层/预览层必须透明，否则会把自己的白底盖在截图上 */
#shotMark,#shotPrev{pointer-events:none;background:transparent}
.shot-sel{
  position:absolute;border:1.5px dashed #7fb3dd;
  background:rgba(140,190,225,.14);display:none;z-index:5;cursor:move;
}
.shot-text-input{
  position:absolute;z-index:6;display:none;
  background:transparent;border:none;outline:none;
  color:var(--ice-night);font-family:var(--serif);min-width:60px;
  caret-color:var(--ice-deep);
}
body[data-theme="dark"] .shot-bar{background:rgba(14,28,44,.96);border-color:#2b4a68}
body[data-theme="dark"] .shot-tool{color:#9db8cf}
body[data-theme="dark"] .shot-tool:hover{background:#1c3450;color:#d9ebfa}
body[data-theme="dark"] .shot-tool.active{background:#1c3450;border-color:#3d76a8;color:#d9ebfa}
body[data-theme="dark"] .shot-action{background:#15283d;border-color:#2b4a68;color:#9db8cf}
body[data-theme="dark"] .shot-action:hover{border-color:#3d76a8;color:#d9ebfa}
body[data-theme="dark"] .shot-sep{background:#2b4a68}

/* ============ 阅读工具（单篇导出） ============ */
.reader-tools{
  display:flex;justify-content:flex-end;gap:10px;margin-top:22px;
  max-width:840px;margin-left:auto;margin-right:auto;
}
.reader-tools button{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:18px;font-size:12.5px;letter-spacing:1.5px;
  border:1px solid var(--line);background:#fbfdff;color:var(--ink-soft);cursor:pointer;transition:.2s;
}
.reader-tools button:hover{border-color:var(--ice);color:var(--ice-night);background:#eef5fb}
/* 导出图片的克隆容器（强制浅色纸面） */
.export-clone{
  position:fixed;left:-10000px;top:0;z-index:-1;
  background:#fff;color:#33475b;width:840px;padding:42px 48px;
  font-family:"Noto Serif SC","Songti SC",serif;
}
.export-clone .reader-body{color:#3d5164;font-size:15.5px;line-height:2.1;letter-spacing:.6px;white-space:pre-wrap;word-break:break-word}
.export-clone .reader-title{font-size:20px;font-weight:500;letter-spacing:2px;margin-bottom:18px;color:#33475b}
.export-clone .r-date{font-size:25px;font-weight:500;letter-spacing:3px;color:#44709a;line-height:1.35}
.export-clone .r-week{font-size:12.5px;color:#9db2c2;letter-spacing:3px;margin-top:5px}
.export-clone .r-tag{display:inline-flex;font-size:11.5px;color:#6f879b;border:1px solid #d9e7f1;border-radius:14px;padding:4px 11px;background:#fbfdff;margin:2px}
.export-clone .r-tags{margin-top:12px}
.export-clone .reader-head{border-bottom:1px solid #e7f0f7;padding-bottom:20px;margin-bottom:24px}
.export-clone .reader-meta{margin-top:34px;padding-top:16px;border-top:1px dashed #d9e7f1;display:flex;gap:26px;flex-wrap:wrap;font-size:11.5px;color:#9db2c2;letter-spacing:1px}
.export-clone .reader-images{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 6px}
.export-clone .reader-images img{max-width:280px;max-height:200px;border-radius:10px;border:1px solid #d9e7f1}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:34px;left:50%;transform:translate(-50%,18px);
  background:rgba(52,74,94,.94);color:#eaf3fa;font-size:13px;letter-spacing:2px;
  padding:12px 28px;border-radius:26px;box-shadow:0 10px 30px rgba(40,60,80,.3);
  opacity:0;pointer-events:none;z-index:99;
  transition:opacity .38s var(--ease-soft),transform .38s var(--ease-out);
  display:flex;align-items:center;gap:9px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:1380px){
  .today-layout{grid-template-columns:minmax(0,1fr) 330px;gap:22px}
  .browse-grid{grid-template-columns:360px minmax(0,1fr);gap:24px}
}
@media (max-width:1080px){
  .today-layout{display:flex;flex-direction:column;gap:20px}
  .diary-card{grid-column:auto;grid-row:auto;order:2;min-height:62vh}
  .side-tags{grid-column:auto;grid-row:auto;order:1}
  .side-time{display:none}
  .side-words{grid-column:auto;grid-row:auto;order:3}
  .browse-grid{grid-template-columns:1fr}
  .entry-list{max-height:440px}
  .reader{min-height:auto}
  .stat-cards{grid-template-columns:repeat(2,1fr)}
  .chart-row{grid-template-columns:1fr}
  .heat-panel{grid-template-columns:1fr;gap:26px}
  .heat-side{flex-direction:row;flex-wrap:wrap;align-items:flex-start;
    border-left:none;border-top:1px solid var(--line-soft);padding:24px 0 4px}
  .heat-item{flex:1;min-width:140px}
}
@media (max-width:960px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;
    padding:16px 20px;gap:14px}
  .brand{margin-bottom:0}
  .side-date{margin:0 0 0 6px}
  .nav{flex-direction:row;margin-left:auto;order:3;width:100%}
  .nav-item{flex:1;justify-content:center;padding:9px 6px;font-size:12.5px;letter-spacing:1px;min-height:44px}
  .side-foot{display:none}
  main{padding:26px 16px 50px}
  .view-head{margin-bottom:22px}
  .reader{padding:26px 20px}
  .diary-title{padding:18px 20px 13px;font-size:16px}
  .diary-body{padding:18px 20px;font-size:16px;min-height:300px}
  .diary-bar{padding:13px 20px 15px}
  .tag{padding:10px 14px;min-height:44px}
  .cal-nav button{width:38px;height:38px}
  .cal-cell{font-size:14px}
  .btn-primary{padding:11px 30px;min-height:44px}
  .heat-panel{padding:22px 20px}
  .chart-panel{padding:20px 18px 12px}
  .focus-exit{top:16px;right:16px;padding:8px 14px}
  .noise-panel{right:14px;bottom:16px;left:14px;justify-content:center;flex-wrap:wrap}
  .tag-editor{padding:0 20px 10px}
  .toolbar{padding:0 20px 6px}
  .toolbar .tool-btn{min-height:38px;padding:7px 12px}
  .img-attachments{padding:0 20px 12px}
}
@media (prefers-reduced-motion:reduce){
  .view{animation:none}
  *{transition:none!important}
}

<script>
/* ================= 数据与工具 ================= */
var STORE_KEY = 'yuki_diary_v1';
var WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
var WEATHERS = [
  {k:'sun',  n:'晴',  i:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/>'},
  {k:'cloud',n:'多云',i:'<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9.5a3.8 3.8 0 0 1 .5 7.56"/>'},
  {k:'over', n:'阴',  i:'<path d="M6 17a3.6 3.6 0 0 1-.4-7.18A5 5 0 0 1 15.2 9a3.4 3.4 0 0 1 .5 6.8"/><path d="M18.5 14.2A3.1 3.1 0 0 0 15.4 10"/>'},
  {k:'rain', n:'雨',  i:'<path d="M7 15a3.6 3.6 0 0 1-.4-7.18A5 5 0 0 1 16 8.6"/><path d="M8 17.5l-1 2.5M12.5 17.5l-1 2.5M17 17.5l-1 2.5"/>'},
  {k:'snow', n:'雪',  i:'<path d="M7 14a3.6 3.6 0 0 1-.4-7.18A5 5 0 0 1 16 7.6"/><path d="M8.5 18.5h.01M12.5 20h.01M16 18h.01"/>'}
];
var MOODS = [
  {k:'calm',  n:'平静'},
  {k:'joy',   n:'欢愉'},
  {k:'wist',  n:'怅然'},
  {k:'tired', n:'疲惫'},
  {k:'miss',  n:'思念'}
];

function pad(n){return (n<10?'0':'')+n;}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function todayKey(){return keyOf(new Date());}
function fmtCN(k){var d=parseKey(k);return {y:d.getFullYear(),m:pad(d.getMonth()+1),d:pad(d.getDate()),w:WEEK_CN[d.getDay()]};}
function fmtTime(ts){var d=new Date(ts);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());}
function countWords(s){return (s||'').replace(/\s/g,'').length;}
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function loadAll(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}
  catch(e){return {};}
}
function saveAll(data){localStorage.setItem(STORE_KEY,JSON.stringify(data));}
var DB = loadAll();

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);
}

/* ================= 飘雪背景 ================= */
(function(){
  var cv=document.getElementById('snowfield');
  if(!cv)return;
  var ctx=cv.getContext('2d'),flakes=[],W=0,H=0,dpr=1,last=0,raf=0;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* 预渲染一枚柔和的雪点，逐帧只做 drawImage，比每帧画圆/加阴影快得多 */
  var sprite=document.createElement('canvas'),S=32;
  sprite.width=sprite.height=S;
  (function(){
    var sc=sprite.getContext('2d');
    var g=sc.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(.42,'rgba(233,242,250,.72)');
    g.addColorStop(1,'rgba(220,234,246,0)');
    sc.fillStyle=g;sc.fillRect(0,0,S,S);
  })();
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);
    cv.style.width=W+'px';cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function seed(){
    flakes=[];
    var n=Math.min(46,Math.max(16,Math.floor(W/34)));
    for(var i=0;i<n;i++)flakes.push({
      x:Math.random()*W,y:Math.random()*H,
      r:1.1+Math.random()*2.6,
      sp:14+Math.random()*26,      /* 像素/秒：和屏幕刷新率无关，144Hz 下不会突然变快 */
      sw:6+Math.random()*16,
      ph:Math.random()*Math.PI*2,
      om:.10+Math.random()*.16
    });
  }
  function draw(now){
    raf=requestAnimationFrame(draw);
    if(!last)last=now;
    var dt=Math.min((now-last)/1000,.05);last=now;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i];
      f.y+=f.sp*dt;f.ph+=dt*0.5;
      f.x+=Math.sin(f.ph)*f.sw*dt;
      if(f.y-f.r>H){f.y=-f.r*2;f.x=Math.random()*W;}
      if(f.x<-40)f.x=W+30;
      if(f.x>W+40)f.x=-30;
      var d=f.r*3.4;
      ctx.globalAlpha=f.om;
      ctx.drawImage(sprite,f.x-d/2,f.y-d/2,d,d);
    }
    ctx.globalAlpha=1;
  }
  function start(){if(raf)return;last=0;raf=requestAnimationFrame(draw);}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
  resize();seed();
  var rt=0;
  window.addEventListener('resize',function(){
    clearTimeout(rt);rt=setTimeout(function(){resize();seed();},140);
  });
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  if(reduce){
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i],d=f.r*3.4;
      ctx.globalAlpha=f.om;ctx.drawImage(sprite,f.x-d/2,f.y-d/2,d,d);
    }
    ctx.globalAlpha=1;
  }else start();
})();

/* ================= 壁纸：按视图切换，今日执笔按日期在两张之间轮换 ================= */
(function(){
  var nodes=document.querySelectorAll('.wallpaper .wp');
  if(!nodes.length)return;
  var daySeed=new Date().getDate();
  function pick(route){
    if(route==='browse')return 'town';
    if(route==='stats')return 'night';
    return daySeed%2===0?'day':'cg';
  }
  window.__applyWallpaper=function(route){
    var key=pick(route);
    for(var i=0;i<nodes.length;i++){
      nodes[i].classList.toggle('on',nodes[i].dataset.wp===key);
    }
  };
})();

/* ================= 路由 ================= */
var routes=['today','browse','stats'];
function go(route){
  if(routes.indexOf(route)<0)route='today';
  location.hash='#/'+route;
}
function applyRoute(){
  var route=(location.hash||'').replace('#/','')||'today';
  if(routes.indexOf(route)<0)route='today';
  if(route!=='today'){
    if(document.body.classList.contains('focus-mode'))exitFocus();
  }
  document.querySelectorAll('.nav-item').forEach(function(b){
    b.classList.toggle('active',b.dataset.route===route);
  });
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  document.getElementById('view-'+route).classList.add('active');
  if(route==='browse')renderBrowse();
  if(route==='stats')renderStats();
  if(route==='today')renderToday();
  if(window.__applyWallpaper)window.__applyWallpaper(route);
}
window.addEventListener('hashchange',applyRoute);
document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('.nav-item');if(b)go(b.dataset.route);
});

/* ================= 今日执笔 ================= */
var form={weather:'',mood:''};
function tagIcon(k){
  var w=WEATHERS.find(function(x){return x.k===k;});
  if(!w)return '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">'+w.i+'</svg>';
}
function renderTags(){
  document.getElementById('weatherTags').innerHTML=WEATHERS.map(function(w){
    return '<button type="button" class="tag'+(form.weather===w.k?' sel':'')+'" data-g="weather" data-k="'+w.k+'">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">'+w.i+'</svg>'+w.n+'</button>';
  }).join('');
  document.getElementById('moodTags').innerHTML=MOODS.map(function(m){
    return '<button type="button" class="tag'+(form.mood===m.k?' sel':'')+'" data-g="mood" data-k="'+m.k+'">'+m.n+'</button>';
  }).join('');
}
/* ========== 自定义标签 ========== */
var currentTags=[];
function renderTagChips(){
  document.getElementById('tagChips').innerHTML=currentTags.map(function(t){
    return '<span class="tag-chip">'+esc(t)+'<span class="tc-del" data-t="'+esc(t)+'">×</span></span>';
  }).join('');
}
document.getElementById('tagInput').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var v=this.value.trim();
  if(!v)return;
  if(currentTags.indexOf(v)>=0){toast('这个标签已经添加过了');return;}
  if(currentTags.length>=6){toast('最多添加 6 个标签');return;}
  currentTags.push(v);
  this.value='';
  renderTagChips();
  draftSave();
});
document.getElementById('tagChips').addEventListener('click',function(e){
  var d=e.target.closest('.tc-del');if(!d)return;
  currentTags=currentTags.filter(function(t){return t!==d.dataset.t;});
  renderTagChips();
  draftSave();
});
/* 素材草稿自动留存：插入图片/标签时合并进当天条目（正文需点保存） */
function draftSave(){
  var tk=todayKey();
  if(!currentImages.length&&!currentTags.length)return;
  var old=DB[tk];
  if(old){
    old.images=currentImages.slice();old.tags=currentTags.slice();old.updatedAt=Date.now();
  }else{
    DB[tk]={date:tk,title:'',content:'',weather:form.weather,mood:form.mood,
      words:0,images:currentImages.slice(),tags:currentTags.slice(),
      createdAt:Date.now(),updatedAt:Date.now()};
  }
  saveAll(DB);
}
function renderToday(){
  var now=new Date(),tk=todayKey(),f=fmtCN(tk);
  document.getElementById('sideWeek').textContent=f.w;
  document.getElementById('sideDate').textContent=f.y+' 年 '+f.m+' 月 '+f.d+' 日';
  document.getElementById('todayYmd').textContent=f.y+' 年 '+f.m+' 月 '+f.d+' 日';
  document.getElementById('todayWeek').innerHTML=f.w+'　·　雪が溶ける前に';
  var e=DB[tk],locked=false;
  form.weather=e?e.weather:'';form.mood=e?e.mood:'';
  renderTags();
  var titleEl=document.getElementById('titleInput'),bodyEl=document.getElementById('bodyInput');
  var meta=e?('最后保存于 '+fmtTime(e.updatedAt)):'';
  titleEl.value=e?e.title||'':'';
  bodyEl.value=e?e.content||'':'';
  currentImages=e&&e.images?e.images.slice():[];
  currentTags=e&&e.tags?e.tags.slice():[];
  renderImages();

function compressImage(file,callback){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=1200,scale=Math.min(1,maxW/img.width);
      var canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      callback(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  shot.panX=Math.max(-maxX,Math.min(maxX,shot.panX));

  var cx=e.clientX-sr.left-sr.width/2,cy=e.clientY-sr.top-sr.height/2;

function commitText(){

    shot.mctx.fillStyle=shot.color;

(function(){
  var stage=document.getElementById('shotStage');
  stage.addEventListener('mousedown',function(e){
    if(e.target.id==='shotTextInput')return;
    if(!shot.open)return;
    if(e.button===1||e.button===2||spaceHeld){startPan(e);return;}
    if(e.button!==0)return;
    var p=shotPos(e);
    shot.drawing=true;shot.startX=p.x;shot.startY=p.y;
    if(shot.mode==='select'){
      var sel=document.getElementById('shotSel');
      sel.style.display='block';
      var cr=shot.base.getBoundingClientRect(),sr=stage.getBoundingClientRect();
      sel.style.left=(cr.left-sr.left+p.x/shot.scaleX)+'px';
      sel.style.top=(cr.top-sr.top+p.y/shot.scaleY)+'px';
      sel.style.width='0px';sel.style.height='0px';
    }else if(shot.mode==='pen'){
      snapShot();
      shot.mctx.strokeStyle=shot.color;shot.mctx.lineWidth=shot.size*shotK();
      shot.mctx.lineCap='round';shot.mctx.lineJoin='round';
      shot.mctx.beginPath();shot.mctx.moveTo(p.x,p.y);
      shot.mctx.lineTo(p.x+0.1,p.y+0.1);shot.mctx.stroke();
    }else if(shot.mode==='mosaic'){
      snapShot();
      mosaicAt(p.x,p.y);
    }else if(shot.mode==='text'){
      shot.drawing=false;
      placeText(e);
    }else{
      snapShot();
    }
  });
  stage.addEventListener('mousemove',function(e){
    if(panDrag){movePan(e);return;}
    if(!shot.open||!shot.drawing)return;
    var p=shotPos(e);
    if(shot.mode==='select'){
      shot.lastP=p;
      var sel=document.getElementById('shotSel');
      var cr=shot.base.getBoundingClientRect(),sr=stage.getBoundingClientRect();
      var x1=Math.min(shot.startX,p.x),y1=Math.min(shot.startY,p.y);
      var w=Math.abs(p.x-shot.startX),h=Math.abs(p.y-shot.startY);
      sel.style.left=(cr.left-sr.left+x1/shot.scaleX)+'px';
      sel.style.top=(cr.top-sr.top+y1/shot.scaleY)+'px';
      sel.style.width=(w/shot.scaleX)+'px';
      sel.style.height=(h/shot.scaleY)+'px';
    }else if(shot.mode==='pen'){
      shot.mctx.lineTo(p.x,p.y);shot.mctx.stroke();
    }else if(shot.mode==='mosaic'){
      mosaicAt(p.x,p.y);
    }else if(shot.mode==='arrow'||shot.mode==='rect'||shot.mode==='ellipse'){
      drawShapePreview(shot.startX,shot.startY,p.x,p.y);
    }
  });
  window.addEventListener('mouseup',function(){
    if(panDrag){endPan();return;}
    if(!shot.open||!shot.drawing)return;
    shot.drawing=false;
    if(shot.mode==='select'){
      var sel=document.getElementById('shotSel');
      sel.style.display='none';
      var p=shot.lastP||{x:shot.startX,y:shot.startY};
      var w=Math.abs(p.x-shot.startX),h=Math.abs(p.y-shot.startY);
      if(w>=10&&h>=10){
        cropShot(Math.min(shot.startX,p.x),Math.min(shot.startY,p.y),w,h);
      }
    }else if(shot.mode==='arrow'||shot.mode==='rect'||shot.mode==='ellipse'){
      shot.mctx.drawImage(shot.prev,0,0);
      shot.pctx.clearRect(0,0,shot.prev.width,shot.prev.height);
    }
  });
  /* 滚轮缩放（以光标为锚点）；屏蔽舞台上的右键菜单以便右键拖动平移 */
  stage.addEventListener('contextmenu',function(e){e.preventDefault();});
  stage.addEventListener('wheel',function(e){
    if(!shot.open||!shot.base)return;
    e.preventDefault();
    zoomShotAt(e);
  },{passive:false});
})();

/* 截图入口：
   ①「截图」= 直接对网页画面做快照（html2canvas 渲染），零系统弹窗，点一下就有结果；
   ②「整屏」= 系统屏幕捕获，首次选一次共享内容后本次会话内复用，不再重复询问。 */
var shotRetried=false,screenStream=null,screenVideo=null;
function shotBlank(canvas){
  var ctx=canvas.getContext('2d');
  var d=ctx.getImageData(0,0,canvas.width,Math.min(canvas.height,160)).data;
  var nw=0;for(var i=0;i<d.length;i+=4){if(!(d[i]>245&&d[i+1]>245&&d[i+2]>245))nw++;}
  return nw/(d.length/4)<0.02;
}
function showShot(canvas,tip){
  if(shotBlank(canvas))throw new Error('截图为空白，请重试');
  var tb=document.getElementById('toolbar');
  tb.style.display='';shotRetried=false;
  openShotEditor(canvas);
  if(tip)toast(tip);
}
/* ---------- ① 网页快照：默认入口，不弹任何系统窗口 ---------- */
function pageShot(){
  var sf=document.getElementById('snowfield');
  var sfr=sf?sf.getBoundingClientRect():null;
  var cw=document.documentElement.clientWidth;
  var ch=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight);
  function draw(){
    return html2canvas(document.body,{
      backgroundColor:null,scale:window.devicePixelRatio>1?2:1,
      useCORS:true,logging:false,
      windowWidth:cw,windowHeight:ch,
      onclone:function(doc){
        /* 关键：克隆文档里 CSS 动画会重新播放，不关掉的话正文会被拍成半透明 */
        var s=doc.createElement('style');
        s.textContent='*,*::before,*::after{animation:none!important;transition:none!important}'+
          '.toast,.ice-flake,.ice-ripple,.focus-exit,.noise-panel,.shot-mask{display:none!important}';
        doc.head.appendChild(s);
        var t=doc.getElementById('toolbar');if(t)t.style.display='none';
        /* 纸张底色铺满整页；雪花固定首屏，避免被拉成竖条 */
        doc.documentElement.style.height='auto';doc.body.style.height='auto';
        var c=doc.getElementById('snowfield');
        if(c&&sfr){
          c.style.position='absolute';c.style.top='0px';c.style.left='0px';
          c.style.width=Math.round(sfr.width)+'px';c.style.height=Math.round(sfr.height)+'px';
        }
      }
    });
  }
  if(typeof html2canvas!=='undefined')return draw();
  return new Promise(function(resolve,reject){
    window.__loadHtml2canvas(function(ok){
      if(!ok){reject(new Error('截图组件加载失败，请检查网络后刷新页面重试'));return;}
      draw().then(resolve,reject);
    });
  });
}
/* ---------- ② 整屏捕获：首次选一次，之后复用不再询问 ---------- */
function screenLive(){
  if(!screenStream)return false;
  var t=screenStream.getVideoTracks()[0];
  return !!(t&&t.readyState==='live');
}
function updateScreenBtn(){
  var b=document.getElementById('btnScreen');
  if(!b)return;
  var on=screenLive();
  b.classList.toggle('on',on);
  b.title=on?'整屏共享已开启：再点一次直接截图（可在浏览器顶部的共享提示条里随时停止）'
            :'截取整个屏幕或某个窗口（首次需选择一次共享内容，之后不再询问）';
}
function clearScreen(){
  if(screenStream){try{screenStream.getTracks().forEach(function(t){t.stop();});}catch(e){}}
  screenStream=null;screenVideo=null;updateScreenBtn();
}
function requestScreen(){
  return navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:false}).then(function(s){
    screenStream=s;
    var t=s.getVideoTracks()[0];
    if(t)t.addEventListener('ended',function(){
      screenStream=null;screenVideo=null;updateScreenBtn();toast('整屏共享已停止');
    });
    var v=document.createElement('video');
    v.muted=true;v.playsInline=true;v.srcObject=s;
    screenVideo=v;
    updateScreenBtn();
    return v.play().catch(function(){});
  });
}
function grabFrame(){
  var v=screenVideo;
  if(!v)return Promise.reject(new Error('没有可用的整屏画面'));
  return new Promise(function(resolve,reject){
    var tries=0;
    (function wait(){
      if(v.videoWidth>0&&v.videoHeight>0){
        var c=document.createElement('canvas');
        c.width=v.videoWidth;c.height=v.videoHeight;
        c.getContext('2d').drawImage(v,0,0);
        resolve(c);
      }else if(tries++<60){
        setTimeout(wait,100);
      }else reject(new Error('无法获取画面帧'));
    })();
  });
}
function screenShot(){
  var tb=document.getElementById('toolbar'),prev=tb.style.display;
  tb.style.display='none';
  var first=!screenLive();
  var p=first?requestScreen():Promise.resolve();
  return p.then(function(){
    if(!screenLive())throw new Error('已取消：未选择共享内容');
    return grabFrame();
  }).then(function(canvas){
    showShot(canvas,first?'整屏共享已开启，再点「整屏」可直接截图（浏览器顶部共享条可随时停止）'
                        :'已截取整屏画面');
  }).catch(function(err){
    tb.style.display=prev;
    var name=err&&err.name;
    toast((name==='NotAllowedError'||name==='AbortError')?'已取消：未选择共享内容'
         :(err&&err.message?err.message:'屏幕捕获失败'));
  });
}

  var tk=todayKey();
  var html=['一','二','三','四','五','六','日'].map(function(w){return '<div class="dow">'+w+'</div>';}).join('');
  for(var i=0;i<lead;i++)html+='<div class="cal-cell"></div>';
  for(var d=1;d<=days;d++){
    var k=keyOf(new Date(y,m,d));
    var cls='cal-cell';
    var hasEntry=DB[k]&&(DB[k].content||(DB[k].images&&DB[k].images.length));
    if(hasEntry)cls+=' has';
    if(k===tk)cls+=' today';
    if(k===selectedKey)cls+=' selected';
    if(k>tk)cls+=' future';
    html+='<div class="'+cls+'"'+(hasEntry?' data-key="'+k+'"':'')+'>'+d+'</div>';
  }
  document.getElementById('calGrid').innerHTML=html;
}
var activeTag='';
function renderTagFilter(){
  var set={};
  sortedKeys().forEach(function(k){
    var e=DB[k];
    if(e&&e.tags)(e.tags||[]).forEach(function(t){set[t]=1;});
  });
  var tags=Object.keys(set).sort();
  var box=document.getElementById('tagFilter');
  if(!tags.length){box.innerHTML='';return;}
  var html='<button type="button" class="tchip'+(activeTag?'':' on')+'" data-t="">全部</button>';
  html+=tags.map(function(t){
    return '<button type="button" class="tchip'+(t===activeTag?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';
  }).join('');
  box.innerHTML=html;
}
document.getElementById('tagFilter').addEventListener('click',function(e){
  var b=e.target.closest('.tchip');if(!b)return;
  activeTag=b.dataset.t||'';
  renderTagFilter();
  renderList(document.getElementById('searchInput').value.trim());
});
function renderList(kw){
  var keys=sortedKeys().filter(function(k){
    var e=DB[k];
    if(!e.content&&!(e.images&&e.images.length))return false;
    if(activeTag&&!((e.tags||[]).indexOf(activeTag)>=0))return false;
    if(!kw)return true;
    return (e.title&&e.title.indexOf(kw)>=0)||(e.content&&e.content.indexOf(kw)>=0);
  }).reverse();
  var box=document.getElementById('entryList');
  if(!keys.length){
    box.innerHTML='<div style="padding:30px 10px;text-align:center;color:var(--ink-faint);font-size:12.5px;letter-spacing:1px">'+
      (kw||activeTag?'没有找到符合条件的日记':'还没有任何日记，去写今天的第一篇吧')+'</div>';
    return;
  }
  box.innerHTML=keys.map(function(k){
    var e=DB[k],f=fmtCN(k);
    var title=e.title||('无题 · '+f.m+'月'+f.d+'日');
    var prev=(e.content||'').replace(/\s/g,'').slice(0,34);
    var tagsHtml=(e.tags&&e.tags.length)?'<div class="ei-tags">'+e.tags.map(function(t){return '<span class="ei-tag">'+esc(t)+'</span>';}).join('')+'</div>':'';
    return '<div class="entry-item'+(k===selectedKey?' active':'')+'" data-key="'+k+'">'+
      '<div class="ei-top"><span class="ei-date">'+f.m+'月'+f.d+'日 · '+f.w+'</span>'+
      '<span class="ei-words">'+e.words+' 字</span></div>'+
      '<div class="ei-title">'+esc(title)+'</div>'+
      '<div class="ei-prev">'+esc(prev)+'</div>'+tagsHtml+'</div>';
  }).join('');
}
function renderReader(){
  var box=document.getElementById('reader');
  var e=selectedKey?DB[selectedKey]:null;
  if(!e){
    box.innerHTML='<div class="reader-empty">'+
      '<svg width="64" height="64" viewBox="0 0 32 32" fill="none" stroke="#9db2c2" stroke-width="1.2" stroke-linecap="round"><path d="M16 4v24M6.5 10.5l19 11M25.5 10.5l-19 11"/><path d="M16 4l-2.6 3M16 4l2.6 3M16 28l-2.6-3M16 28l2.6-3"/></svg>'+
      '<p>雪地上还没有脚印</p><small>从左侧日历选择一个日子，重读那天的故事</small></div>';
    return;
  }
  var f=fmtCN(e.date),keys=sortedKeys(),idx=keys.indexOf(e.date);
  var sealed=e.date<todayKey();
  var tags=[];
  if(e.weather)tags.push('<span class="r-tag">'+tagIcon(e.weather)+nameOf('weather',e.weather)+'</span>');
  if(e.mood)tags.push('<span class="r-tag">心境 · '+nameOf('mood',e.mood)+'</span>');
  if(e.tags&&e.tags.length)e.tags.forEach(function(t){tags.push('<span class="r-tag"># '+esc(t)+'</span>');});
  var title=e.title||'<span style="color:var(--ink-faint);font-weight:300">无题</span>';
  box.innerHTML=
    (sealed?'<div class="seal-banner">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5M12 14v3"/></svg>'+
      '已于 '+fmtTime(e.updatedAt)+' 封存，不可修改</div>':'')+
    '<div class="reader-head" style="'+(sealed?'border:none;padding-bottom:0;margin-top:18px':'')+'">'+
      '<div class="r-date">'+f.y+' 年 '+f.m+' 月 '+f.d+' 日</div>'+
      '<div class="r-week">'+f.w+'</div>'+
      '<div class="r-tags">'+tags.join('')+'</div>'+
    '</div>'+
    '<h3 class="reader-title">'+title+'</h3>'+
    '<div class="reader-body">'+renderLinks(e.content)+'</div>'+
    (e.images&&e.images.length?'<div class="reader-images">'+
      e.images.map(function(im){return '<img src="'+im.dataUrl+'" alt="'+esc(im.name)+'" onclick="openLightbox(this.src)">';}).join('')+
      '</div>':'')+
    '<div class="reader-meta">'+
      '<span>落笔于 '+fmtTime(e.createdAt)+'</span>'+
      (e.updatedAt!==e.createdAt?'<span>最后保存于 '+fmtTime(e.updatedAt)+'</span>':'')+
      '<span>'+e.words+' 字</span>'+
    '</div>'+
    '<div class="reader-tools">'+
      '<button id="expTxtBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>导出文本</button>'+
      '<button id="expImgBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>导出为图片</button>'+
    '</div>'+
    '<div class="reader-pager">'+
      '<button id="prevEntry" '+(idx<=0?'disabled':'')+'>← 上一篇</button>'+
      '<button id="nextEntry" '+(idx>=keys.length-1?'disabled':'')+'>下一篇 →</button>'+
    '</div>';
  document.getElementById('prevEntry').onclick=function(){if(idx>0){selectedKey=keys[idx-1];renderBrowse();}};
  document.getElementById('nextEntry').onclick=function(){if(idx<keys.length-1){selectedKey=keys[idx+1];renderBrowse();}};
  document.getElementById('expTxtBtn').onclick=function(){exportEntryTxt(e);};
  document.getElementById('expImgBtn').onclick=function(){exportEntryImg();};
}
function exportEntryTxt(e){
  var f=fmtCN(e.date);
  var parts=[];
  if(e.title)parts.push(e.title);
  parts.push(f.y+' 年 '+f.m+' 月 '+f.d+' 日 '+f.w);
  var meta=[];
  if(e.weather)meta.push('天气：'+nameOf('weather',e.weather));
  if(e.mood)meta.push('心境：'+nameOf('mood',e.mood));
  if(e.tags&&e.tags.length)meta.push('标签：'+e.tags.join('、'));
  if(meta.length)parts.push(meta.join('　'));
  parts.push('——');
  parts.push(e.content||'');
  var blob=new Blob([parts.join('\n')],{type:'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='白色相簿-'+e.date+'.txt';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('已导出为文本');
}
function exportEntryImg(){
  var src=document.getElementById('reader');
  if(!src)return;
  var clone=src.cloneNode(true);
  clone.classList.add('export-clone');
  clone.querySelectorAll('.reader-pager,.reader-tools,.seal-banner').forEach(function(n){n.parentNode&&n.parentNode.removeChild(n);});
  clone.querySelectorAll('.reader-head .r-tags').forEach(function(n){n.style.marginTop='12px';});
  document.body.appendChild(clone);
  toast('正在生成图片…');
  function doExportPic(){
    html2canvas(clone,{backgroundColor:'#ffffff',scale:2,useCORS:true}).then(function(canvas){
      var a=document.createElement('a');
      a.download='白色相簿-'+selectedKey+'.png';
      a.href=canvas.toDataURL('image/png');a.click();
      document.body.removeChild(clone);
      toast('图片已保存到下载目录');
    }).catch(function(){
      document.body.removeChild(clone);
      toast('导出图片失败，请重试');
    });
  }
  if(typeof html2canvas==='undefined'){
    window.__loadHtml2canvas(function(ok){
      if(!ok){document.body.removeChild(clone);toast('截图组件加载失败，请检查网络后刷新页面重试');return;}
      doExportPic();
    });
  }else doExportPic();
}
function renderBrowse(){
  if(!selectedKey){
    var ks=sortedKeys();
    selectedKey=DB[todayKey()]?todayKey():(ks.length?ks[ks.length-1]:null);
  }
  renderCal();renderTagFilter();renderList(document.getElementById('searchInput').value.trim());renderReader();
}
document.getElementById('calPrev').onclick=function(){calCursor.setMonth(calCursor.getMonth()-1);renderCal();};
document.getElementById('calNext').onclick=function(){calCursor.setMonth(calCursor.getMonth()+1);renderCal();};
document.getElementById('calGrid').addEventListener('click',function(e){
  var c=e.target.closest('.cal-cell.has');if(!c)return;
  selectedKey=c.dataset.key;renderBrowse();
});
document.getElementById('entryList').addEventListener('click',function(e){
  var it=e.target.closest('.entry-item');if(!it)return;
  selectedKey=it.dataset.key;renderBrowse();
});
document.getElementById('searchInput').addEventListener('input',function(){
  renderList(this.value.trim());
});

/* ================= 写作统计 ================= */
function streaks(){
  var set={},ks=sortedKeys(),cur=0,best=0,run=0,prev=null;
  ks.forEach(function(k){set[k]=1;});
  /* 最长连续 */
  ks.forEach(function(k){
    if(prev){
      var d=parseKey(k),p=parseKey(prev);
      run=Math.round((d-p)/86400000)===1?run+1:1;
    }else run=1;
    if(run>best)best=run;prev=k;
  });
  /* 当前连续：今天没写从昨天起算 */
  var d=new Date();
  if(!set[keyOf(d)])d.setDate(d.getDate()-1);
  while(set[keyOf(d)]){cur++;d.setDate(d.getDate()-1);}
  return {cur:cur,best:best};
}
function heatLevel(w){
  if(!w)return 0;
  if(w<100)return 1;if(w<300)return 2;if(w<600)return 3;return 4;
}
var charts=[];
function renderStats(){
  var ks=sortedKeys(),total=ks.length,words=0,monthCount=0,monthWords=0;
  var ym=todayKey().slice(0,7);
  ks.forEach(function(k){
    words+=DB[k].words;
    if(k.slice(0,7)===ym){monthCount++;monthWords+=DB[k].words;}
  });
  var st=streaks();
  document.getElementById('statCards').innerHTML=[
    {n:total,u:'篇',l:'累计日记',s:'本月写下 '+monthCount+' 篇'},
    {n:words,u:'字',l:'累计字数',s:'本月 '+monthWords+' 字'},
    {n:st.cur,u:'天',l:'当前连续',s:st.cur?'雪还没有停':'昨天休息了一天'},
    {n:st.best,u:'天',l:'最长连续',s:'坚持过的最长纪录'}
  ].map(function(c){
    return '<div class="stat-card"><div class="num">'+c.n+'<small>'+c.u+'</small></div>'+
      '<div class="lab">'+c.l+'</div><div class="sub">'+c.s+'</div></div>';
  }).join('');

  /* 热力图：近 24 周，周一起 */
  var cells='';
  var s0=new Date();s0.setDate(s0.getDate()-((s0.getDay()+6)%7)-23*7);
  for(var i=0;i<24*7;i++){
    var d=new Date(s0);d.setDate(d.getDate()+i);
    var k=keyOf(d),e=DB[k],lv=e?heatLevel(e.words):0;
    var title=k+(e?'　'+e.words+' 字':'　无日记');
    cells+='<div class="heat-cell'+(lv?' l'+lv:'')+'" title="'+title+'"></div>';
  }
  document.getElementById('heatGrid').innerHTML=cells;

  charts.forEach(function(c){c.dispose();});charts=[];
  var dark=document.body.dataset.theme==='dark';
  var axisColor=dark?'#7b93a7':'#9db2c2';
  var axisLineColor=dark?'#243b52':'#d9e7f1';
  var splitLineColor=dark?'#1b2f43':'#edf3f8';
  var axisStyle={color:axisColor,fontSize:10,fontFamily:'"Noto Sans SC",sans-serif'};
  /* 近 30 日字数 */
  var d30=[],v30=[];
  for(var i=29;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var k=keyOf(d);
    d30.push((d.getMonth()+1)+'/'+d.getDate());
    v30.push(DB[k]?DB[k].words:0);
  }
  var c1=echarts.init(document.getElementById('chart30'));charts.push(c1);
  c1.setOption({
    grid:{left:42,right:14,top:18,bottom:30},
    tooltip:{trigger:'axis',backgroundColor:'rgba(52,74,94,.94)',borderWidth:0,textStyle:{color:'#eaf3fa',fontSize:12}},
    xAxis:{type:'category',data:d30,axisLine:{lineStyle:{color:axisLineColor}},axisTick:{show:false},axisLabel:{color:axisColor,fontSize:9,interval:4}},
    yAxis:{type:'value',minInterval:1,axisLabel:{color:axisColor,fontSize:10,formatter:function(v){return v30.some(Boolean)||v===0?v:'';}},splitLine:{lineStyle:{color:splitLineColor}},axisLine:{show:false},axisTick:{show:false}},
    series:[{type:'bar',data:v30,barWidth:'58%',
      itemStyle:{borderRadius:[3,3,0,0],
        color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#8fb4d1'},{offset:1,color:'#c9dfef'}])}}]
  });
  /* 星期分布：周一起 */
  var wk=[0,0,0,0,0,0,0];
  ks.forEach(function(k){var d=parseKey(k);wk[(d.getDay()+6)%7]++;});
  /* 热力图侧栏：写作习惯 */
  var busiest=wk.indexOf(Math.max.apply(null,wk));
  var sideItems=[
    {v:total,u:'天',l:'有日记的日子'},
    {v:total?Math.round(words/total):0,u:'字',l:'每篇平均字数'},
    {v:total?['周一','周二','周三','周四','周五','周六','周日'][busiest]:'——',u:'',l:'最常落笔的日子'}
  ];
  document.getElementById('heatSide').innerHTML=sideItems.map(function(it){
    return '<div class="heat-item"><div class="hv">'+it.v+(it.u?'<small>'+it.u+'</small>':'')+'</div><div class="hl">'+it.l+'</div></div>';
  }).join('');
  var c2=echarts.init(document.getElementById('chartWeek'));charts.push(c2);
  c2.setOption({
    grid:{left:42,right:14,top:18,bottom:30},
    tooltip:{trigger:'axis',backgroundColor:'rgba(52,74,94,.94)',borderWidth:0,textStyle:{color:'#eaf3fa',fontSize:12}},
    xAxis:{type:'category',data:['周一','周二','周三','周四','周五','周六','周日'],axisLabel:{color:axisColor,fontSize:10},axisLine:{lineStyle:{color:axisLineColor}},axisTick:{show:false}},
    yAxis:{type:'value',minInterval:1,axisLabel:{color:axisColor,fontSize:10,formatter:function(v){return wk.some(Boolean)||v===0?v:'';}},splitLine:{lineStyle:{color:splitLineColor}},axisLine:{show:false},axisTick:{show:false}},
    series:[{type:'bar',data:wk,barWidth:'52%',
      itemStyle:{borderRadius:[3,3,0,0],
        color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#5e8fb3'},{offset:1,color:'#b5d0e5'}])}}]
  });

  /* 月度汇总 */
  var mm={};
  ks.forEach(function(k){
    var m=k.slice(0,7);
    if(!mm[m])mm[m]={n:0,w:0};
    mm[m].n++;mm[m].w+=DB[k].words;
  });
  var rows=Object.keys(mm).sort().reverse().slice(0,12).map(function(m){
    var x=mm[m];
    return '<tr><td class="m">'+m.replace('-',' 年 ')+' 月</td><td>'+x.n+' 篇</td><td>'+x.w+' 字</td><td>'+Math.round(x.w/x.n)+' 字/篇</td></tr>';
  }).join('');
  document.querySelector('#monthTable tbody').innerHTML=rows||
    '<tr><td colspan="4" style="text-align:center;color:var(--ink-faint);padding:26px">还没有数据</td></tr>';
}
window.addEventListener('resize',function(){charts.forEach(function(c){c.resize();});});

/* ================= 导出备份 ================= */

  var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});

/* ================= 主题切换 ================= */
function setTheme(mode,persist){
  /* 只在切换瞬间打开颜色过渡，切换结束就撤掉，避免常驻过渡拖慢渲染 */
  document.body.classList.add('theming');
  clearTimeout(setTheme._t);
  setTheme._t=setTimeout(function(){document.body.classList.remove('theming');},700);
  document.body.dataset.theme=mode;
  var icon=document.getElementById('themeIcon');
  var label=document.getElementById('themeLabel');
  if(mode==='dark'){
    icon.innerHTML='<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    label.textContent='日间模式';
  }else{
    icon.innerHTML='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    label.textContent='夜间模式';
  }
  document.querySelectorAll('.toolbar [data-font]').forEach(function(b){
    var on=b.dataset.font===document.getElementById('bodyInput').style.fontSize;
    if(on){
      b.style.background=mode==='dark'?'#1c3450':'#e3eef7';
      b.style.color=mode==='dark'?'var(--ice-night)':'var(--ice-night)';
    }
  });
  if(persist)localStorage.setItem('yuki_theme',mode);
  if((location.hash||'').indexOf('stats')>=0)renderStats();
}
document.getElementById('themeBtn').addEventListener('click',function(){
  var next=document.body.dataset.theme==='dark'?'light':'dark';
  setTheme(next,true);
  toast(next==='dark'?'已切换至雪夜模式':'已切换至日间模式');
});
(function initTheme(){
  var saved=localStorage.getItem('yuki_theme');
  setTheme(saved==='dark'?'dark':'light',false);
})();

/* ================= 导入备份 ================= */
document.getElementById('importBtn').addEventListener('click',function(){
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change',function(){
  var file=this.files[0];this.value='';
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('bad');
      var added=0,skipped=0;
      Object.keys(data).forEach(function(k){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
        var en=data[k];
        if(!en||typeof en!=='object')return;
        if(!en.content&&!(en.images&&en.images.length)&&!(en.tags&&en.tags.length))return;
        if(DB[k]){skipped++;return;}
        DB[k]=en;
        DB[k].words=DB[k].words||countWords(en.content||'');
        added++;
      });
      if(!added&&!skipped){toast('文件里没有可导入的日记');return;}
      try{
        saveAll(DB);
        toast('导入完成：新增 '+added+' 篇'+(skipped?'，跳过已存在 '+skipped+' 篇':''));
        if((location.hash||'').indexOf('browse')>=0)renderBrowse();
        if((location.hash||'').indexOf('stats')>=0)renderStats();
      }catch(err){toast('存储空间不足，导入失败');}
    }catch(err){toast('备份文件格式不正确');}
  };
  reader.readAsText(file);
});

/* ================= 启动 ================= */
applyRoute();
